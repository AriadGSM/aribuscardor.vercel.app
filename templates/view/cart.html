<div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Carrito de Compras</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <div id="cartItems"></div>
        <div class="cart-total mt-3 pt-3 border-top">
            <strong>Total: </strong><span id="cartTotal">S/. 0.00</span>
        </div>
        <div class="d-grid gap-2 mt-3">
            <button class="btn btn-primary" type="button" id="checkoutButton">Proceder al Pago</button>
        </div>
    </div>
</div>
