<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/whasa.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="whatsapp-float">
        <button class="whatsapp-button" onclick="toggleChat()">
            <i class="fab fa-whatsapp"></i>
            <span class="whatsapp-text">¿Preguntas sobre mi arte?</span>
        </button>
        <div class="chat-bot" id="chatBot">
            <div class="chat-header">
                <span>Chat de Consultas</span>
                <button class="close-chat" onclick="toggleChat()">×</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-options">
                <button onclick="selectOption('bienvenida')">Iniciar Consulta</button>
                <button onclick="selectOption('detalles')">Detalles del Cuadro</button>
                <button onclick="selectOption('estilo')">Estilo y Cotización</button>
                <button onclick="selectOption('contacto')">Contacto Directo</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.whasa.js') }}"></script>
</body>
</html>
